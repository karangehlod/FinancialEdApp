name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Backend: lint + unit tests ─────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres-auth:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgres-data:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: data_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      ENVIRONMENT: testing
      TESTING: "true"
      DEBUG: "false"
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-production-min-32-chars-abc"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      AUTH_DB_HOST: localhost
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_test
      AUTH_DB_USER: postgres
      AUTH_DB_PASSWORD: testpass
      DATA_DB_HOST: localhost
      DATA_DB_PORT: "5433"
      DATA_DB_NAME: data_test
      DATA_DB_USER: postgres
      DATA_DB_PASSWORD: testpass
      REDIS_URL: "redis://localhost:6379/0"
      EMAIL_ENABLED: "false"
      ALLOWED_ORIGINS: "http://localhost:13000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ --output-format=github || true

      - name: Run unit tests
        # Skip live/integration tests — those need real external services
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --timeout=30 \
            --ignore=tests/live \
            --ignore=tests/integration \
            -q

  # ── Frontend: build + type-check + vitest ─────────────────────────────────
  frontend-build:
    name: Frontend — Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit || true

      - name: Run vitest unit tests
        run: npm test -- --run --reporter=verbose || true

      - name: Build for production
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:18000/api/v1"

  # ── Docker: build images (only on push to main) ────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: financialedapp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: financialedapp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:18000/api/v1
