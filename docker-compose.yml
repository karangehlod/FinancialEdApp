# =============================================================================
# FinancialEdApp — Docker Compose (all-in-one: app + observability)
# =============================================================================
# Single command to start everything:
#   docker compose up -d
#
# Service map:
#   Infrastructure:    postgres_auth · postgres_data · redis
#   Application:       backend · worker · frontend
#   Observability:     otelcol · jaeger · prometheus · grafana
#   Local email:       mailhog
#
# URLs once running:
#   Frontend:   http://localhost:13000
#   Backend:    http://localhost:18000/docs
#   Grafana:    http://localhost:3000  (admin / admin)
#   Jaeger:     http://localhost:16686
#   Prometheus: http://localhost:9090
#   Mailhog:    http://localhost:8025
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # Auth PostgreSQL (users, refresh_tokens, oauth_accounts)
  # ---------------------------------------------------------------------------
  postgres_auth:
    image: pgvector/pgvector:pg16
    container_name: financialedapp-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./database_setup/db/init/02-auth-init.sql:/docker-entrypoint-initdb.d/01-auth-init.sql:ro
    ports:
      - "${AUTH_DB_EXPOSED_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Data PostgreSQL (expenses, budgets, goals, loans …)
  # ---------------------------------------------------------------------------
  postgres_data:
    image: pgvector/pgvector:pg16
    container_name: financialedapp-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DATA_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_data:/var/lib/postgresql/data
      - ./database_setup/db/init/03-data-init.sql:/docker-entrypoint-initdb.d/01-data-init.sql:ro
    ports:
      - "${DATA_DB_EXPOSED_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DATA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis — cache, rate-limit store, WebSocket pub/sub
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: financialedapp-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_EXPOSED_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # Receives OTLP from the backend → forwards traces to Jaeger, exposes
  # aggregated metrics for Prometheus to scrape on :8889.
  # ---------------------------------------------------------------------------
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: financialedapp-otelcol
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otelcol/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  — backends send spans here
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape target (collector metrics)
      - "13133:13133" # Health check extension
    # otelcol-contrib is distroless — no shell/wget/curl; healthcheck disabled.
    # Dependents use service_started so startup isn't blocked.
    healthcheck:
      disable: true
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Jaeger — distributed trace storage + UI
  # Accepts OTLP from the collector; UI at http://localhost:16686
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: financialedapp-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14317:4317"   # OTLP gRPC (direct — not used when routing via collector)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes /metrics from the backend (and otelcol)
  # UI at http://localhost:9090
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: financialedapp-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otelcol
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana — dashboards for Prometheus metrics + Jaeger traces
  # UI at http://localhost:3000  (admin / admin — change in production)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: financialedapp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/financialedapp-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Mailpit — local SMTP sink (multi-arch drop-in for Mailhog)
  # Inspect captured emails at http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: axllent/mailpit:latest
    container_name: financialedapp-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP (backend sends here)
      - "8025:8025"  # Web UI
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: financialedapp-backend:${APP_VERSION:-1.0.0}
    container_name: financialedapp-api
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # --- Application ---
      APP_NAME: ${APP_NAME:-FinancialEdApp}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}

      # --- CORS ---
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:13000}

      # --- JWT / Security ---
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # --- Auth Database ---
      AUTH_DB_HOST: postgres_auth
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Data Database ---
      DATA_DB_HOST: postgres_data
      DATA_DB_PORT: 5432
      DATA_DB_NAME: ${DATA_DB_NAME}
      DATA_DB_USER: ${POSTGRES_USER}
      DATA_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # --- Connection Pool ---
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      PGBOUNCER_MODE: ${PGBOUNCER_MODE:-false}

      # --- Redis ---
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-5}
      REDIS_RETRY_ON_TIMEOUT: ${REDIS_RETRY_ON_TIMEOUT:-true}

      # --- Cache TTLs ---
      CACHE_TTL_USER_PROFILE: ${CACHE_TTL_USER_PROFILE:-300}
      CACHE_TTL_EXPENSES: ${CACHE_TTL_EXPENSES:-300}
      CACHE_TTL_BUDGETS: ${CACHE_TTL_BUDGETS:-300}
      CACHE_TTL_GOALS: ${CACHE_TTL_GOALS:-300}
      CACHE_TTL_ACCESS_TOKEN: ${CACHE_TTL_ACCESS_TOKEN:-1800}
      CACHE_TTL_EXCHANGE_RATES: ${CACHE_TTL_EXCHANGE_RATES:-3600}

      # --- Rate Limiting ---
      RATE_LIMIT_LOGIN_LIMIT: ${RATE_LIMIT_LOGIN_LIMIT:-5}
      RATE_LIMIT_LOGIN_WINDOW: ${RATE_LIMIT_LOGIN_WINDOW:-60}
      RATE_LIMIT_REGISTER_LIMIT: ${RATE_LIMIT_REGISTER_LIMIT:-3}
      RATE_LIMIT_REGISTER_WINDOW: ${RATE_LIMIT_REGISTER_WINDOW:-60}
      RATE_LIMIT_FORGOT_PASSWORD_LIMIT: ${RATE_LIMIT_FORGOT_PASSWORD_LIMIT:-3}
      RATE_LIMIT_FORGOT_PASSWORD_WINDOW: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW:-3600}
      RATE_LIMIT_REFRESH_LIMIT: ${RATE_LIMIT_REFRESH_LIMIT:-10}
      RATE_LIMIT_REFRESH_WINDOW: ${RATE_LIMIT_REFRESH_WINDOW:-60}
      RATE_LIMIT_OAUTH_LIMIT: ${RATE_LIMIT_OAUTH_LIMIT:-10}
      RATE_LIMIT_OAUTH_WINDOW: ${RATE_LIMIT_OAUTH_WINDOW:-60}
      RATE_LIMIT_EXPORTS_LIMIT: ${RATE_LIMIT_EXPORTS_LIMIT:-10}
      RATE_LIMIT_EXPORTS_WINDOW: ${RATE_LIMIT_EXPORTS_WINDOW:-60}
      RATE_LIMIT_ANALYTICS_LIMIT: ${RATE_LIMIT_ANALYTICS_LIMIT:-30}
      RATE_LIMIT_ANALYTICS_WINDOW: ${RATE_LIMIT_ANALYTICS_WINDOW:-60}
      RATE_LIMIT_DEFAULT_AUTH_LIMIT: ${RATE_LIMIT_DEFAULT_AUTH_LIMIT:-300}
      RATE_LIMIT_DEFAULT_AUTH_WINDOW: ${RATE_LIMIT_DEFAULT_AUTH_WINDOW:-60}
      RATE_LIMIT_DEFAULT_UNAUTH_LIMIT: ${RATE_LIMIT_DEFAULT_UNAUTH_LIMIT:-60}
      RATE_LIMIT_DEFAULT_UNAUTH_WINDOW: ${RATE_LIMIT_DEFAULT_UNAUTH_WINDOW:-60}
      RATE_LIMIT_LOCKOUT_MAX_FAILURES: ${RATE_LIMIT_LOCKOUT_MAX_FAILURES:-5}
      RATE_LIMIT_LOCKOUT_WINDOW: ${RATE_LIMIT_LOCKOUT_WINDOW:-900}

      # --- Email (routes to Mailhog in local dev) ---
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@financialedu.com}
      FRONTEND_URL: http://localhost:13000

      # --- Notifications ---
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
      BUDGET_ALERT_THRESHOLD: ${BUDGET_ALERT_THRESHOLD:-80.0}

      # --- OAuth (optional) ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}

      # --- Multi-currency ---
      OPEN_EXCHANGE_RATES_API_KEY: ${OPEN_EXCHANGE_RATES_API_KEY:-}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}

      # --- Observability — wired to the otelcol container ---
      OTEL_SERVICE_NAME: financialedapp-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_TRACES_SAMPLER: parentbased_always_on
      METRICS_USERNAME: ${METRICS_USERNAME:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}

      # --- Feature flags ---
      FEATURE_2FA_ENABLED: ${FEATURE_2FA_ENABLED:-true}
      FEATURE_OAUTH_ENABLED: ${FEATURE_OAUTH_ENABLED:-true}
      FEATURE_WEBSOCKET_ENABLED: ${FEATURE_WEBSOCKET_ENABLED:-true}
      FEATURE_GDPR_ENABLED: ${FEATURE_GDPR_ENABLED:-true}
      FEATURE_ADMIN_ENABLED: ${FEATURE_ADMIN_ENABLED:-true}
      FEATURE_CURRENCY_CONVERSION_ENABLED: ${FEATURE_CURRENCY_CONVERSION_ENABLED:-true}
      FEATURE_CHAT_ENABLED: ${FEATURE_CHAT_ENABLED:-false}

    depends_on:
      postgres_auth:
        condition: service_healthy
      postgres_data:
        condition: service_healthy
      redis:
        condition: service_healthy
      otelcol:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    networks:
      - financialedapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ARQ Worker — background tasks (budget alerts, loan reminders, crons)
  # Shares the same image as the backend; just a different entrypoint.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: financialedapp-backend:${APP_VERSION:-1.0.0}
    container_name: financialedapp-worker
    restart: unless-stopped
    entrypoint: ["python", "-m", "arq", "app.core.worker.WorkerSettings"]
    healthcheck:
      disable: true
    env_file: .env.docker
    environment:
      APP_NAME: ${APP_NAME:-FinancialEdApp}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_DB_HOST: postgres_auth
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATA_DB_HOST: postgres_data
      DATA_DB_PORT: 5432
      DATA_DB_NAME: ${DATA_DB_NAME}
      DATA_DB_USER: ${POSTGRES_USER}
      DATA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@financialedu.com}
      FRONTEND_URL: http://localhost:13000
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}
      SEND_BUDGET_ALERTS: ${SEND_BUDGET_ALERTS:-true}
      SEND_LOAN_REMINDERS: ${SEND_LOAN_REMINDERS:-true}
      BUDGET_ALERT_THRESHOLD: ${BUDGET_ALERT_THRESHOLD:-80.0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OTEL_SERVICE_NAME: financialedapp-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
    depends_on:
      postgres_auth:
        condition: service_healthy
      postgres_data:
        condition: service_healthy
      redis:
        condition: service_healthy
      otelcol:
        condition: service_started
    networks:
      - financialedapp-network
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend — React / Vite (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:18000/api/v1}
        VITE_APP_NAME: ${APP_NAME:-FinancialEdApp}
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
    image: financialedapp-frontend:${APP_VERSION:-1.0.0}
    container_name: financialedapp-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    networks:
      - financialedapp-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  postgres_auth_data:
    driver: local
  postgres_data_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  logs:
    driver: local

# =============================================================================
# Network
# =============================================================================
networks:
  financialedapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
